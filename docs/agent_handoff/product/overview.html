# 产品定位

Fourier 是一个个人使用的高密度 RSS/Folo 聚合阅读客户端，基于 Flutter，支持 Android 与 macOS。它是 X-Ray 个人使用的软件，围绕 Folo 使用场景构建，但**不是** Folo、RSSNext 或其运营方的官方客户端，也不代表官方发布版本。

## 核心价值

- 通过浏览器登录 Folo，同步文章与已读状态，按分类和订阅源组织高密度信息流。
- 聚焦可重复的阅读工作流：未读/全部时间线、最近阅读、长度排序、长文分块渲染与 macOS 分栏阅读。
- 翻译、摘要、质量过滤和文章关系建立由独立后台队列处理；AI 结果用于辅助阅读，最终决定始终由用户做出。

## 主要功能

- **账号与同步** — Android 和 macOS 均可通过系统浏览器登录 Folo，也保留长期 Session Token 和旧配置导入作为兼容入口。阅读操作写回 Folo，云端已读状态按可配置时间窗口同步。
- **时间线** — 未读/全部筛选、最近阅读、文章搜索、长度排序与 macOS 分栏阅读。
- **订阅源** — Articles / Social Media / Inbox 分组，分类与订阅源筛选和静默订阅源；Android 订阅页提供搜索，macOS 还可添加 RSS、编辑订阅和取消订阅，取消订阅可通过撤销恢复。
- **文章阅读** — HTML 拆块渲染、目录跳转、Markdown 复制、图片画廊与视频播放。YouTube 和 Bilibili 优先使用定制播放器，失败时保留官方嵌入回退。
- **AI 翻译 / 摘要** — 使用彼此独立的 LLM 配置、并发参数和滚动补位后台队列。未读状态控制自动流水线入口，已经开始的任务可继续完成。
- **垃圾拦截** — DeepSeek 质量过滤只处理未读文章，结果进入独立审核页；用户可保留、移除或撤销操作，模型不直接替用户做最终决定。
- **相关文章关系** — 默认关闭的可选增益功能。开启后基于新生成的摘要建立“同一事件”或“基本等价”关系，用于文章内展示和后续分析，当前不会自动移动文章。
- **静默订阅源** — macOS 汇总视图支持批量选择、复制 Markdown、保存文件，以及导出后批量标为已读。
- **配置迁移** — 设置可导出为 JSON 并通过剪贴板导入；导出内容包含登录凭据、API Key、Prompt 与订阅源偏好，必须按敏感配置保管。
- **平台体验** — Android 提供移动端导航、侧滑审核与触觉反馈；macOS 提供原生分栏、克制的 Liquid Glass、右键菜单、快捷键和连续撤销/重做。
- **应用更新** — 两个平台均只在用户主动操作时检查 GitHub Releases；Android 下载并调用系统安装界面，macOS 使用 Sparkle 更新链路。

## 平台边界

- 发布构建提供 Android APK 与 macOS arm64 安装包，不上传应用商店。
- macOS 订阅管理和静默订阅源批量导出尚未迁移到 Android。
- 相关文章关系依赖 DeepSeek，默认关闭；关闭期间新生成的摘要不会积压等待以后补建关系。
- 自动更新检查不会在后台主动发起，只有用户在设置页点击时才访问 GitHub。

## 优先级

- 快速、可重复的阅读工作流。
- 低摩擦的 macOS 分栏阅读体验。
- 稳定的 Android 行为。
- 同步、翻译、摘要、过滤任务要有清晰反馈。
- 避免 UI 看起来像 Folo 官方品牌，或暗示官方所有权。

## 身份与命名空间

- 产品名：`Fourier`；Dart package 名：`fourier`。
- Android applicationId / macOS bundle id / MethodChannel 命名空间统一为 `io.github.xraygit.fourier`。
- 历史 `com.folo.*` 与 `com.autofolo` 引用已经废弃，不得重新引入。
